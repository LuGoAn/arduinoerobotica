<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:#EAF2FF;font-family:Nunito,Arial,sans-serif;color:#0F1F4D}
#c{position:absolute;inset:0;display:block;touch-action:none}
.lab{position:absolute;left:0;top:0;transform:translate(-50%,-100%);pointer-events:none;font:600 15px Fredoka,Arial,sans-serif;padding:4px 12px;border-radius:14px;border:2.5px solid #0F1F4D;white-space:nowrap;box-shadow:2px 2px 0 rgba(15,31,77,.25)}
.lab.in{background:#2350E8;color:#fff}.lab.out{background:#FFD23F}.lab.br{background:#0FA3AE;color:#fff}.lab.no{background:#fff}
.lab:after{content:'';position:absolute;left:50%;bottom:-9px;width:2.5px;height:8px;background:#0F1F4D}
#hud{position:absolute;left:14px;top:14px;display:flex;flex-direction:column;gap:8px;max-width:330px}
#val{background:#fff;border:3px solid #0F1F4D;border-radius:18px;padding:8px 16px;font:700 30px Fredoka,Arial,sans-serif;color:#2350E8;box-shadow:4px 4px 0 #0F1F4D}
#val small{display:block;font:600 14px Nunito,Arial,sans-serif;color:#33416B}
#st{border:3px solid #0F1F4D;border-radius:16px;padding:6px 14px;font:600 17px Fredoka,Arial,sans-serif;background:#CDF3E2}
#st.warn{background:#FFE9A8}#st.bad{background:#FFD0CA}
#btns{position:absolute;right:14px;top:14px;display:flex;gap:8px}
body:not(.solo) #btns{top:auto;bottom:14px}body:not(.solo) #tip{left:14px;transform:none}
body:not(.solo) #btns button{font-size:19px;padding:8px 18px}body:not(.solo) .lab{font-size:18px}body:not(.solo) #val{font-size:38px}body:not(.solo) #st{font-size:21px}
#btns button{font:600 15px Fredoka,Arial,sans-serif;border:2.5px solid #0F1F4D;border-radius:20px;padding:6px 14px;background:#fff;color:#0F1F4D;cursor:pointer;box-shadow:2px 2px 0 #0F1F4D}
#tip{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);font:600 14px Nunito,Arial,sans-serif;background:rgba(15,31,77,.82);color:#fff;padding:6px 16px;border-radius:20px;pointer-events:none;transition:opacity .6s}
#solo{position:absolute;left:14px;bottom:14px;background:#fff;border:2.5px solid #0F1F4D;border-radius:16px;padding:8px 14px;display:none;gap:10px;align-items:center;font:600 14px Fredoka}
body.solo #solo{display:flex}
#solo select,#solo input{font:inherit}
#load{position:absolute;inset:0;display:grid;place-items:center;font:600 22px Fredoka,Arial,sans-serif;background:#EAF2FF}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>

<div id="load">Carregando o 3D…</div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';

const Q=new URLSearchParams(location.search);
let SC=+(Q.get('c')||0);const SOLO=!Q.has('embed');if(SOLO)document.body.classList.add('solo');
const cv=document.getElementById('c');
const R=new THREE.WebGLRenderer({canvas:cv,antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));
R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=1.05;
const pm=new THREE.PMREMGenerator(R);const ENV=pm.fromScene(new RoomEnvironment(),.04).texture;
const cam=new THREE.PerspectiveCamera(42,1,1,4000);
const ctl=new OrbitControls(cam,cv);ctl.enableDamping=true;ctl.maxPolarAngle=Math.PI*0.47;ctl.minDistance=40;ctl.maxDistance=520;
let scene,S,labels=[];const labBox=document.getElementById('labs');

/* ---------- materiais e peças ---------- */
const M=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.6,metalness:0},o));
const MAT={navy:M('#0F1F4D'),black:M('#1B2440',{roughness:.5}),metal:M('#C9D3E3',{metalness:.85,roughness:.28}),steel:M('#D6DEE9',{metalness:.9,roughness:.22}),
 white:M('#F4F8FF'),wood:M('#C98D57',{roughness:.75}),teal:M('#0A8F9A',{roughness:.45}),gold:M('#D4AF37',{metalness:.8,roughness:.3}),chip:M('#202638',{roughness:.4}),
 floor:M('#D5DEEC',{roughness:.9}),wall:M('#F1F5FC',{roughness:.95}),wall2:M('#E3EAF6',{roughness:.95})};
function mesh(g,m,x=0,y=0,z=0,par){const o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;(par||scene).add(o);return o}
const box=(w,h,d,m,x,y,z,p)=>mesh(new THREE.BoxGeometry(w,h,d),m,x,y,z,p);
// caixa apoiada: y é a base
const boxOn=(w,h,d,m,x,yb,z,p)=>box(w,h,d,m,x,yb+h/2,z,p);
const cyl=(rt,rb,h,m,x,y,z,p,s=32)=>mesh(new THREE.CylinderGeometry(rt,rb,h,s),m,x,y,z,p);
const cylOn=(r,h,m,x,yb,z,p,s)=>cyl(r,r,h,m,x,yb+h/2,z,p,s);
function rbox(w,h,d,r,m){const s=new THREE.Shape(),x=-w/2,y=-h/2;s.moveTo(x+r,y);s.lineTo(x+w-r,y);s.quadraticCurveTo(x+w,y,x+w,y+r);s.lineTo(x+w,y+h-r);s.quadraticCurveTo(x+w,y+h,x+w-r,y+h);s.lineTo(x+r,y+h);s.quadraticCurveTo(x,y+h,x,y+h-r);s.lineTo(x,y+r);s.quadraticCurveTo(x,y,x+r,y);
 const g=new THREE.ExtrudeGeometry(s,{depth:d,bevelEnabled:true,bevelThickness:r*.4,bevelSize:r*.4,bevelSegments:3});g.translate(0,0,-d/2);return mesh(g,m)}
function wire(pts,color,r=.45,par){const c=new THREE.CatmullRomCurve3(pts.map(p=>new THREE.Vector3(...p)),false,'catmullrom',.2);const o=mesh(new THREE.TubeGeometry(c,Math.max(20,pts.length*14),r,8),M(color,{roughness:.45}));(par||scene).add(o);return o}
function cable(pts,color='#2350E8',r=.6,rad=4){const P=pts.map(p=>new THREE.Vector3(...p));const path=new THREE.CurvePath();let cur=P[0].clone();
 for(let i=1;i<P.length;i++){const b=P[i];if(i<P.length-1){const a=P[i-1],c=P[i+1];const d1=Math.min(rad,a.distanceTo(b)/2),d2=Math.min(rad,b.distanceTo(c)/2);
   const p1=b.clone().add(a.clone().sub(b).setLength(d1)),p2=b.clone().add(c.clone().sub(b).setLength(d2));if(cur.distanceTo(p1)>.01)path.add(new THREE.LineCurve3(cur,p1));path.add(new THREE.QuadraticBezierCurve3(p1,b.clone(),p2));cur=p2}
  else path.add(new THREE.LineCurve3(cur,b.clone()))}
 const o=mesh(new THREE.TubeGeometry(path,P.length*24,r,8),M(color,{roughness:.45}));return o}
// do ponto (já no chão) até o pino, subindo pela perna da mesa mais próxima
function toBench(B,pts,color){const pin=B.pinIn(),last=new THREE.Vector3(...pts[pts.length-1]);const c=B.g.position;let best,bd=1e9;
 [[-32,-18],[32,-18],[-32,18],[32,18]].forEach(l=>{const w=B.g.localToWorld(new THREE.Vector3(l[0],0,l[1]));const d=w.distanceTo(new THREE.Vector3(last.x,0,last.z));if(d<bd){bd=d;best=w}});
 const out=new THREE.Vector3(best.x-c.x,0,best.z-c.z).normalize();const o=best.clone().add(out.multiplyScalar(4.5));
 const top=B.top+.7;const lt=new THREE.Vector3(pin.x,0,pin.z).sub(new THREE.Vector3(o.x,0,o.z)).multiplyScalar(.15);
 cable([...pts,[o.x,.7,o.z],[o.x,top+.6,o.z],[o.x+lt.x,top,o.z+lt.z],[pin.x,top,pin.z+0.01],[pin.x,pin.y+.3,pin.z]],color)}
function txtTex(t,w=256,h=64,bg='#0A8F9A',fg='#E8F1F2',font='bold 40px Fredoka, Arial'){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle=bg;x.fillRect(0,0,w,h);x.fillStyle=fg;x.font=font;x.textAlign='center';x.textBaseline='middle';x.fillText(t,w/2,h/2+2);const tx=new THREE.CanvasTexture(c);tx.colorSpace=THREE.SRGBColorSpace;return tx}
function label(text,kind,pos){const d=document.createElement('div');d.className='lab '+kind;d.textContent=text;labBox.appendChild(d);labels.push({d,p:new THREE.Vector3(...pos)})}

// Arduino Uno (6,9 x 5,3 cm), base em y=0
function arduino(){const g=new THREE.Group();
 boxOn(6.9,.16,5.3,MAT.teal,0,.25,0,g);
 [[-3,-2.2],[3,-2.2],[-3,2.2],[3,2.2]].forEach(p=>cylOn(.22,.25,MAT.metal,p[0],0,p[1],g,10));
 boxOn(1.6,1.1,1.2,MAT.metal,-3.3,.41,-1.2,g);boxOn(1.4,1.1,.9,MAT.black,-3.25,.41,1.6,g);
 boxOn(3.6,.35,.9,MAT.chip,.9,.41,1.2,g);
 boxOn(4.8,.8,.25,MAT.black,.6,.41,-2.45,g);boxOn(2.4,.8,.25,MAT.black,-.6,.41,2.45,g);boxOn(1.9,.8,.25,MAT.black,2,.41,2.45,g);
 const lbl=new THREE.Mesh(new THREE.PlaneGeometry(1.6,.6),new THREE.MeshBasicMaterial({map:txtTex('UNO')}));lbl.rotation.x=-Math.PI/2;lbl.position.set(1.6,.42,-.9);g.add(lbl);
 return g}
// protoboard (8,2 x 5,5)
function protoboard(){const g=new THREE.Group();const c=document.createElement('canvas');c.width=512;c.height=340;const x=c.getContext('2d');x.fillStyle='#F4F6F8';x.fillRect(0,0,512,340);x.fillStyle='#9AA6BC';
 for(let i=0;i<30;i++)for(let j=0;j<10;j++){x.fillRect(22+i*16,60+j*22+(j>4?20:0),6,6)}x.fillStyle='#E8453C';x.fillRect(16,20,480,3);x.fillStyle='#2350E8';x.fillRect(16,318,480,3);
 const tx=new THREE.CanvasTexture(c);tx.colorSpace=THREE.SRGBColorSpace;
 const mats=[MAT.white,MAT.white,M('#fff',{map:tx,roughness:.7}),MAT.white,MAT.white,MAT.white];const o=mesh(new THREE.BoxGeometry(8.2,.85,5.5),mats,0,.425,0,g);return g}
// LED de 5 mm (desenhado um pouco maior para dar para ver)
function led(color){const g=new THREE.Group();const col=new THREE.Color(color);
 const mat=new THREE.MeshStandardMaterial({color:col,transparent:true,opacity:.75,roughness:.15,emissive:col,emissiveIntensity:.05});
 cylOn(.36,.1,MAT.metal,-.12,0,0,g,8).scale.set(.12,1,.12);
 [-.13,.13].forEach(x=>cylOn(.05,.6,MAT.metal,x,0,0,g,6));
 cylOn(.38,.12,mat,0,.6,0,g,20);cylOn(.33,.55,mat,0,.72,0,g,20);mesh(new THREE.SphereGeometry(.33,20,12,0,Math.PI*2,0,Math.PI/2),mat,0,1.27,0,g);
 const L=new THREE.PointLight(col,0,14,2);L.position.set(0,1.6,0);g.add(L);
 g.userData.set=(on)=>{mat.emissiveIntensity=on?2.6:.04;mat.opacity=on?.95:.7;L.intensity=on?18:0};return g}
function buzzer(){const g=new THREE.Group();cylOn(1.2,.95,MAT.black,0,0,0,g,28);cylOn(.22,.05,M('#3A4666'),0,.95,0,g,14);
 const rings=[];for(let i=0;i<3;i++){const r=new THREE.Mesh(new THREE.TorusGeometry(1.5,.06,6,40),new THREE.MeshBasicMaterial({color:'#E8453C',transparent:true,opacity:0}));r.rotation.x=-Math.PI/2;r.position.y=1.1;g.add(r);rings.push(r)}
 g.userData.rings=rings;return g}
// bancada com a parte eletrônica; tudo apoiado no tampo
function bench(x,z,rotY,colors){const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=rotY||0;scene.add(g);
 const H=75;boxOn(70,3,42,MAT.wood,0,H-3,0,g);[[-32,-18],[32,-18],[-32,18],[32,18]].forEach(p=>boxOn(3,H-3,3,M('#8C5A33'),p[0],0,p[1],g));
 const k=new THREE.Group();k.position.set(0,H,0);k.scale.setScalar(3.2);g.add(k);
 const a=arduino();a.position.set(-5.4,0,0);k.add(a);
 const pb=protoboard();pb.position.set(3.6,0,.2);k.add(pb);
 const leds=colors.map((c,i)=>{const l=led(c);l.position.set(1.4+i*1.6,.85,-.9);k.add(l);return l});
 const bz=buzzer();bz.position.set(6.2,.85,1.2);k.add(bz);
 // jumpers do Arduino até a protoboard
 const jc=['#1FA86A','#E0A800','#E8453C','#FF8A1F'];
 leds.forEach((l,i)=>{wire([[-4.6+i*.5,.9,-2.45],[-3+i*.4,2.2,-3.2],[0,2,-2.6],[1.4+i*1.6,1.1,-1.8],[1.4+i*1.6-.2,.9,-1.4]],colors[i],.09,k)});
 wire([[-3.4,.9,2.45],[0,2.3,3.2],[5,2,2.6],[6.2,.9,2.2]],'#FF8A1F',.09,k);
 wire([[-1.2,.9,2.45],[1,1.6,2.8],[3,1.2,2.4],[3.8,.9,2.2]],'#1B2440',.09,k);
 g.updateMatrixWorld(true);
 return {g,k,leds,bz,top:H,ardView:()=>{const t=k.localToWorld(new THREE.Vector3(0,1,0)),p=g.localToWorld(new THREE.Vector3(6,128,50));return [p.toArray(),t.toArray()]},pinIn:()=>{const v=new THREE.Vector3(-3.6,.9,-2.45);return k.localToWorld(v)}}}
function room(w=420,d=320,hw=230,mat2){scene.add(mesh(new THREE.BoxGeometry(w,2,d),MAT.floor,0,-1,0));
 boxOn(w,hw,4,MAT.wall,0,0,-d/2+2);boxOn(4,hw,d,mat2||MAT.wall2,-w/2+2,0,0);
 boxOn(w,10,1,M('#C9D3E3'),0,0,-d/2+4.5);boxOn(1,10,d,M('#C9D3E3'),-w/2+4.5,0,0)}
function lights(){scene.add(new THREE.HemisphereLight('#ffffff','#9DB4E8',.55));const s=new THREE.DirectionalLight('#ffffff',1.6);s.position.set(140,260,180);s.castShadow=true;
 s.shadow.mapSize.set(2048,2048);const sc=s.shadow.camera;sc.left=-260;sc.right=260;sc.top=260;sc.bottom=-260;sc.far=900;s.shadow.bias=-.0006;s.shadow.normalBias=.4;scene.add(s)}

/* ---------- cenas ---------- */
const BUILD=[];
// 0: estoque de alimentos com sensor de temperatura e umidade
BUILD[0]=()=>{room(420,320,230,M('#FFF3E0',{roughness:.95}));
 const sx=-60,sz=-118;// estante encostada na parede do fundo
 const shelfY=[8,58,108,158];[[-70,-20],[70,-20],[-70,20],[70,20]].forEach(p=>boxOn(4,184,4,MAT.metal,sx+p[0],0,sz+p[1]));
 shelfY.forEach(y=>boxOn(146,3,44,MAT.metal,sx,y,sz));
 const card=M('#C89B63',{roughness:.85}),sack=M('#E9DCC0',{roughness:.95}),can=M('#E8453C',{metalness:.5,roughness:.35}),jar=M('#FFD23F',{roughness:.5});
 const top=y=>y+3;
 // prateleira 1: sacos
 [-48,-14,20,52].forEach((x,i)=>{const s=rbox(26,22,18,5,sack);s.position.set(sx+x,top(shelfY[0])+11+1.4,sz);s.rotation.y=(i%2?.12:-.08);scene.add(s)});
 // prateleira 2: caixas
 [-52,-22,8,38].forEach((x,i)=>boxOn(26,24+(i%2)*6,30,card,sx+x,top(shelfY[1]),sz));
 // prateleira 3: latas e potes
 for(let i=0;i<8;i++)cylOn(5,11,i%2?can:jar,sx-56+i*16,top(shelfY[2]),sz-4,undefined,20);
 // prateleira 4: caixas pequenas
 [-50,-25,0,25,50].forEach(x=>boxOn(18,16,24,card,sx+x,top(shelfY[3]),sz));
 // sensor DHT22 preso na parede do fundo
 const B=bench(100,-133,0,['#1FA86A','#E8453C']);const pin0=B.pinIn();const dx=pin0.x,dy=135,dz=-160+4;const dh=new THREE.Group();dh.position.set(dx,dy,dz);dh.scale.setScalar(1.5);scene.add(dh);
 boxOn(9,2,1.2,M('#0F7A55'),0,-11,.6,dh).rotation.x=0;box(7.5,10,3,MAT.white,0,0,1.5,dh);
 const grid=new THREE.Mesh(new THREE.PlaneGeometry(6,7.5),new THREE.MeshBasicMaterial({map:txtTex('',64,80,'#DDE3EE','#000')}));grid.position.set(0,.6,3.02);dh.add(grid);
 for(let i=0;i<4;i++)for(let j=0;j<5;j++)box(.8,.8,.3,MAT.black,-1.8+i*1.2,3+-j*1.25+.2,3.1,dh);
 [-1.5,-.5,.5,1.5].forEach(x=>cylOn(.15,3,MAT.metal,x,-8,1.5,dh,6));
 const pin=pin0;cable([[dx,dy-12,dz+1.2],[dx,B.top+.7,dz+1.2],[dx,B.top+.7,pin.z-1],[pin.x,pin.y+.3,pin.z]]);
 label('Sensor de temperatura e umidade','in',[dx,dy+8,dz+3]);label('Alimentos guardados','no',[sx,190,sz]);label('Arduino','br',[B.pinIn().x+6,90,B.pinIn().z+8]);
 const bl=B.k.localToWorld(new THREE.Vector3(2.2,2.6,-.9));label('LEDs','out',[bl.x,bl.y,bl.z]);
 const fog=new THREE.Fog('#C9D3E3',260,900);scene.fog=fog;
 return {view:{all:[[230,190,260],[0,90,-60]],ard:B.ardView()},bench:B,
  update(st){const T=st.T??24,H=st.H??55;const alert=T>30||H>70;B.leds[0].userData.set(!alert);B.leds[1].userData.set(alert);B.alarm=alert;
   fog.near=lerp(260,40,clamp((H-50)/50,0,1));fog.far=lerp(900,420,clamp((H-50)/50,0,1));
   setVal(T+' °C',H+' % de umidade');setSt(alert?'bad':'',alert?('Alerta: '+(T>30&&H>70?'quente e úmido demais':T>30?'temperatura alta':'umidade alta')):'Tudo normal')}}};

// 1: caixa d'água com sensor ultrassônico
BUILD[1]=()=>{room();
 const tx=-40,tz=-60,base=24,TH=100,TR=40;
 boxOn(100,base,100,M('#B9C4D6',{roughness:.9}),tx,0,tz);
 const tank=new THREE.Mesh(new THREE.CylinderGeometry(TR,TR*.94,TH,48,1,true),new THREE.MeshStandardMaterial({color:'#2350E8',transparent:true,opacity:.28,roughness:.2,side:THREE.DoubleSide,depthWrite:false}));
 tank.position.set(tx,base+TH/2,tz);scene.add(tank);
 const bottom=cylOn(TR*.94,2,M('#1B3FB8'),tx,base,tz);
 const rimT=new THREE.Mesh(new THREE.TorusGeometry(TR,2.2,10,48),M('#1B3FB8'));rimT.rotation.x=Math.PI/2;rimT.position.set(tx,base+TH,tz);scene.add(rimT);
 const lid=cyl(TR+3,TR+3,3,M('#2350E8',{roughness:.4}),tx,base+TH+3,tz,undefined,48);
 const waterMat=new THREE.MeshStandardMaterial({color:'#35C4F5',transparent:true,opacity:.78,roughness:.1});
 const water=cyl(TR*.93,TR*.93,1,waterMat,tx,base+2,tz,undefined,48);
 // sensor HC-SR04 na tampa, olhando para baixo
 const us=new THREE.Group();us.position.set(tx,base+TH+4.5,tz);scene.add(us);us.scale.setScalar(2.2);
 boxOn(4.5,.2,2,M('#1F5BFF'),0,0,0,us);[-1.3,1.3].forEach(x=>{cylOn(.8,.9,MAT.metal,x,.2,0,us,24);cylOn(.55,.05,M('#3A4666'),x,1.1,0,us,20)});
 [-.6,-.2,.2,.6].forEach(x=>boxOn(.15,.6,.15,MAT.metal,x,.2,-1.05,us));
 // cano de entrada: sai da parede e entra pela tampa
 const py=base+TH+18,ix=tx-25;box(ix-(-206)+3,6,6,MAT.metal,(ix-206)/2,py,tz);boxOn(6,6+py-3-(base+TH+4.5),6,MAT.metal,ix,base+TH+4.5,tz);
 boxOn(9,1.5,9,MAT.metal,ix,base+TH+4.5,tz);
 // saída embaixo, apoiada na base e descendo para o ralo
 const oy=base+2.7;box(40,5,5,MAT.metal,tx+TR+20,oy,tz);boxOn(5,oy+2.5,5,MAT.metal,tx+TR+38,0,tz);cylOn(3.4,4,M('#E5561A'),tx+TR+12,oy+2.5,tz);
 cylOn(5,.6,MAT.black,tx+TR+38,0,tz,undefined,20);
 const B=bench(120,-10,-.5,['#1FA86A','#FFD23F','#E8453C']);
 const pin=B.pinIn();{const a=Math.atan2(pin.z-tz,pin.x-tx),cx=Math.cos(a),cz=Math.sin(a),e=TR+3.6,b=51;
 toBench(B,[[tx+cx*4,base+TH+6,tz+cz*4],[tx+cx*(TR+3.6),base+TH+5.2,tz+cz*(TR+3.6)],[tx+cx*e,base+TH+1,tz+cz*e],[tx+cx*e,base+.7,tz+cz*e],[tx+Math.sign(cx)*b,base+.7,tz+cz*e],[tx+Math.sign(cx)*b,.7,tz+cz*e]])}
 label('Sensor de nível (ultrassônico)','in',[tx,base+TH+16,tz]);label('Caixa d’água','no',[tx-TR-10,base+60,tz+TR]);label('Arduino','br',[pin.x+8,92,pin.z+6]);
 const bl=B.k.localToWorld(new THREE.Vector3(3,2.6,-.9));label('LEDs','out',[bl.x,bl.y,bl.z]);
 // jato da torneira quando enche
 const tap=cyl(1.8,1.8,1,new THREE.MeshStandardMaterial({color:'#7BE6FF',transparent:true,opacity:.65}),ix,0,tz);
 return {view:{all:[[230,210,240],[0,80,-40]],ard:B.ardView()},bench:B,
  update(st){const L=clamp(st.L??30,0,100);const h=Math.max(.5,(TH-6)*L/100);water.scale.y=h;water.position.y=base+2+h/2;
   const red=L>=85,yel=L>=60&&!red;B.leds[0].userData.set(!red&&!yel);B.leds[1].userData.set(yel);B.leds[2].userData.set(red);B.alarm=red;
   const fill=!!st.fill;tap.visible=fill;if(fill){const top=base+TH+1.5,bot=base+2+h;const len=Math.max(1,top-bot);tap.scale.y=len;tap.position.y=bot+len/2}
   setVal(Math.round(L)+' %','Distância até a água: '+Math.round(100-L)+' cm');setSt(red?'bad':yel?'warn':'',red?'Risco de transbordar!':yel?'Atenção: nível alto':'Nível normal')}}};

// 2: pasteurização do leite
BUILD[2]=()=>{room();
 const tx=-50,tz=-50,legH=40,TR=34,TH=60;
 [[-24,-24],[24,-24],[-24,24],[24,24]].forEach(p=>cylOn(2.2,legH,MAT.steel,tx+p[0],0,tz+p[1],undefined,12));
 // aquecedor no chão, embaixo do tanque
 cylOn(20,6,MAT.black,tx,0,tz);const ring=new THREE.Mesh(new THREE.TorusGeometry(13,1.6,10,36),MAT.metal);ring.rotation.x=Math.PI/2;ring.position.set(tx,7,tz);scene.add(ring);
 const flames=[];const fm=new THREE.MeshStandardMaterial({color:'#FF9F1C',emissive:'#FF7A00',emissiveIntensity:2,transparent:true,opacity:.85});
 for(let i=0;i<10;i++){const a=i/10*Math.PI*2;const f=mesh(new THREE.ConeGeometry(2.4,12,10),fm,tx+Math.cos(a)*13,14,tz+Math.sin(a)*13);scene.add(f);flames.push(f)}
 const fl=new THREE.PointLight('#FF8A1F',0,120,1.6);fl.position.set(tx,20,tz);scene.add(fl);
 // tanque de aço inox aberto em cima
 const shell=new THREE.Mesh(new THREE.CylinderGeometry(TR,TR,TH,56,1,true),new THREE.MeshStandardMaterial({color:'#D6DEE9',metalness:.9,roughness:.25,side:THREE.DoubleSide,envMapIntensity:1.2}));
 shell.position.set(tx,legH+TH/2,tz);shell.castShadow=true;scene.add(shell);
 cylOn(TR,2,MAT.steel,tx,legH-1,tz,undefined,56);
 const rim=new THREE.Mesh(new THREE.TorusGeometry(TR,1.6,10,56),MAT.steel);rim.rotation.x=Math.PI/2;rim.position.set(tx,legH+TH,tz);scene.add(rim);
 const milkMat=new THREE.MeshStandardMaterial({color:'#FFF8E7',roughness:.35});
 const milk=cyl(TR-1,TR-1,1,milkMat,tx,0,tz,undefined,56);const ML=legH+1+TH*.78;milk.scale.y=TH*.78;milk.position.y=legH+1+TH*.78/2;
 // sonda de temperatura presa na borda e mergulhada no leite
 const px=tx+TR-10,pz=tz;box(10,3,5,MAT.steel,tx+TR-4,legH+TH+1,pz);
 cylOn(.9,TH*.7,MAT.steel,px,legH+TH*.3,pz,undefined,12);boxOn(4,5,4,MAT.black,px,legH+TH+2.5,pz);
 // vapor
 const steam=[];const sm=new THREE.MeshStandardMaterial({color:'#fff',transparent:true,opacity:0,roughness:1,depthWrite:false});
 for(let i=0;i<16;i++){const s=mesh(new THREE.SphereGeometry(4+(i%4),12,8),sm.clone(),tx+((i*37)%50)-25,ML+5,tz+((i*23)%40)-20);s.castShadow=false;scene.add(s);steam.push({s,o:i/16})}
 const B=bench(110,-20,-.45,['#FFD23F','#1FA86A','#E8453C']);
 const pin=B.pinIn();toBench(B,[[px,legH+TH+5,pz],[px,legH+TH+9,pz],[tx+TR+3,legH+TH+6,pz],[tx+TR+3,legH+TH-6,pz],[tx+TR+3,.7,pz+6]]);
 label('Sonda de temperatura','in',[px,legH+TH+12,pz]);label('Tanque de leite','no',[tx-TR-6,legH+TH*.5,tz+TR]);label('Aquecedor','no',[tx-26,10,tz+26]);
 label('Arduino','br',[pin.x+8,92,pin.z+6]);const bl=B.k.localToWorld(new THREE.Vector3(3,2.6,-.9));label('LEDs','out',[bl.x,bl.y,bl.z]);
 let heat=false,T=30;
 return {view:{all:[[200,200,230],[-10,60,-30]],ard:B.ardView()},bench:B,
  tick(t,dt){flames.forEach((f,i)=>{f.visible=heat;f.scale.y=.8+.35*Math.sin(t*9+i*1.7)});fl.intensity=heat?60+20*Math.sin(t*13):0;
   const k=clamp((T-50)/30,0,1);steam.forEach((p,i)=>{const ph=(t*.25+p.o)%1;p.s.position.y=ML+3+ph*70;p.s.material.opacity=k*.5*(1-ph);p.s.scale.setScalar(.6+ph*1.4)})},
  update(st){T=st.T??30;heat=!!st.heat;const yel=T<72,red=T>80;B.leds[0].userData.set(yel);B.leds[1].userData.set(!yel&&!red);B.leds[2].userData.set(red);B.alarm=red;
   milkMat.color.set(new THREE.Color('#FFF8E7').lerp(new THREE.Color('#FFE6BC'),clamp((T-40)/50,0,1)));
   setVal(Math.round(T)+' °C','Temperatura do leite');setSt(red?'bad':yel?'warn':'',red?'Quente demais: o leite pode queimar!':yel?'Abaixo de 72 °C: ainda não está seguro':'Pasteurizado: temperatura certa')}}};

// 3: cozinha com sensor de gás
BUILD[3]=()=>{room();
 // fogão encostado na parede
 const fx=-70,fz=-125,FH=85;boxOn(60,FH,60,MAT.white,fx,0,fz);boxOn(62,3,62,MAT.black,fx,FH,fz);
 box(48,34,1,M('#3A4666',{roughness:.2,metalness:.3}),fx,40,fz+30.6);box(40,3,2,MAT.metal,fx,62,fz+31.5);
 [[-14,-14],[14,-14],[-14,14],[14,14]].forEach(p=>{const r=new THREE.Mesh(new THREE.TorusGeometry(6,1.1,8,28),MAT.metal);r.rotation.x=Math.PI/2;r.position.set(fx+p[0],FH+3.6,fz+p[1]);scene.add(r);cylOn(2.4,1.2,MAT.black,fx+p[0],FH+3,fz+p[1],undefined,16)});
 [-20,-7,7,20].forEach(x=>{const k=cyl(2.6,2.6,3,MAT.black,fx+x,FH-8,fz+31.5,undefined,16);k.rotation.x=Math.PI/2});
 // botijão no chão ao lado
 const gx=fx+62,gz=fz+6;const gm=M('#E8453C',{roughness:.45,metalness:.2});
 cylOn(20,6,M('#B23229'),gx,0,gz);cylOn(18,34,gm,gx,6,gz);mesh(new THREE.SphereGeometry(18,32,16,0,Math.PI*2,0,Math.PI/2),gm,gx,40,gz).scale.y=.55;
 const handle=new THREE.Mesh(new THREE.TorusGeometry(9,1.4,8,30,Math.PI),gm);handle.position.set(gx,52,gz);scene.add(handle);
 cylOn(2.6,8,MAT.metal,gx,48,gz,undefined,12);
 wire([[gx,56,gz],[gx-12,70,gz-10],[fx+30,60,fz-24],[fx+20,40,fz-29]],'#1B2440',1.1);
 // sensor de gás na parede lateral, perto do chão (o gás de cozinha é mais pesado que o ar)
 const sx=-210+4,sy=45,sz=-30;const mq=new THREE.Group();mq.position.set(sx,sy,sz);mq.rotation.y=Math.PI/2;scene.add(mq);mq.scale.setScalar(4);
 boxOn(3.2,.2,2.2,M('#1F5BFF'),0,-1.1,0,mq).rotation.x=Math.PI/2;
 const can=cyl(1,1,1.4,MAT.metal,0,0,.85,mq,24);can.rotation.x=Math.PI/2;const mesh2=cyl(.85,.85,.1,M('#7C8798',{roughness:.9}),0,0,1.6,mq,24);mesh2.rotation.x=Math.PI/2;
 // partículas de gás
 const parts=[];const pmM=new THREE.MeshStandardMaterial({color:'#7BA05B',transparent:true,opacity:.45,depthWrite:false});
 for(let i=0;i<80;i++){const p=new THREE.Mesh(new THREE.SphereGeometry(2.6+(i%3)*1.2,8,6),pmM);scene.add(p);parts.push({p,x:gx,y:56,z:gz,l:Math.random()*30,vx:-(5+Math.random()*8),vy:-(4+Math.random()*4),vz:Math.random()*5-.5})}
 const B=bench(110,-10,-.5,['#1FA86A','#FFD23F','#E8453C']);
 const pin=B.pinIn();toBench(B,[[sx+1.5,sy-3,sz],[sx+2.4,sy-6,sz],[sx+2.4,.7,sz],[sx+20,.7,sz+30]]);
 label('Sensor de gás','in',[sx+4,sy+10,sz]);label('Botijão','no',[gx,70,gz+18]);label('Fogão','no',[fx,FH+16,fz+20]);
 label('Arduino','br',[pin.x+8,92,pin.z+6]);const bl=B.k.localToWorld(new THREE.Vector3(3,2.6,-.9));label('LEDs','out',[bl.x,bl.y,bl.z]);
 let n=0;
 function gasStep(dt,all){parts.forEach((q,i)=>{if(!all&&i>=n){q.p.visible=false;return}q.p.visible=true;q.l+=dt;q.x+=q.vx*dt;q.y=Math.max(3+(i%5)*2,q.y+q.vy*dt);q.z+=q.vz*dt;if(q.x<-200){q.x=-200;q.vz+=dt*2}
   if(q.l>30||q.z>140){q.l=0;q.x=gx+(Math.random()-.5)*6;q.y=56+Math.random()*4;q.z=gz+(Math.random()-.5)*6}q.p.position.set(q.x,q.y,q.z)})}
 for(let k=0;k<300;k++)gasStep(.1,true);
 return {view:{all:[[200,180,250],[-40,50,-50]],ard:B.ardView()},bench:B,
  tick(t,dt){gasStep(dt)},
  update(st){const ppm=st.ppm??3;n=ppm<5?0:Math.round(clamp(Math.log10(ppm)/3,0,1)*80);const red=ppm>=50,yel=ppm>=10&&!red;
   B.leds[0].userData.set(!red&&!yel);B.leds[1].userData.set(yel);B.leds[2].userData.set(red);B.alarm=red;
   const shown=ppm<10?ppm.toFixed(1).replace('.0',''):Math.round(ppm);setVal(shown+' ppm','Gás no ar');setSt(red?'bad':yel?'warn':'',red?'Valor alto de gás!':yel?'Atenção: gás acima do normal':'Ar normal')}}};

/* ---------- utilidades e laço ---------- */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;
const $=s=>document.querySelector(s);
function setVal(v,s){$('#val').innerHTML=v+'<small>'+s+'</small>'}
function setSt(c,t){$('#st').className=c;$('#st').textContent=t}
let state={},fly=null;
function build(i){SC=i;labels.forEach(l=>l.d.remove());labels=[];scene=new THREE.Scene();scene.background=new THREE.Color('#DCE6F5');scene.environment=ENV;lights();
 S=BUILD[i]();S.update(state);go('all',true)}
function go(which,instant){const v=S.view[which];const p=new THREE.Vector3(...v[0]),t=new THREE.Vector3(...v[1]);
 if(instant){cam.position.copy(p);ctl.target.copy(t);ctl.update();fly=null}else fly={p0:cam.position.clone(),t0:ctl.target.clone(),p,t,s:performance.now()}}
$('#b-all').onclick=()=>go('all');$('#b-ard').onclick=()=>go('ard');
function size(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
addEventListener('resize',size);
addEventListener('message',e=>{const d=e.data;if(!d||d.type!=='sim3d')return;if(d.scene!==SC){state=d.state||{};build(d.scene)}else{state=d.state||{};S.update(state)}});
// controle próprio quando a página é aberta sozinha
const sv=$('#s-v'),ss=$('#s-sc');
function soloState(){const v=+sv.value;const st=[{T:Math.round(15+v*.3),H:Math.round(30+v*.6)},{L:v},{T:Math.round(20+v*.75),heat:v<70},{ppm:Math.pow(10,v*3/100)}][SC];$('#s-t').textContent='';return st}
if(SOLO){ss.value=SC;ss.onchange=()=>{SC=+ss.value;state=soloState();build(SC)};sv.oninput=()=>{state=soloState();S.update(state)};state=soloState()}
let last=performance.now();const t0=last;
cv.addEventListener('pointerdown',()=>{$('#tip').style.opacity=0});
function loop(now){const dt=Math.min(.1,(now-last)/1000);last=now;const t=(now-t0)/1000;
 if(fly){const k=clamp((now-fly.s)/900,0,1),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;cam.position.lerpVectors(fly.p0,fly.p,e);ctl.target.lerpVectors(fly.t0,fly.t,e);if(k>=1)fly=null}
 ctl.update();if(S.tick)S.tick(t,dt);
 const B=S.bench;B.bz.userData.rings.forEach((r,i)=>{const ph=(t*1.6+i/3)%1;r.material.opacity=B.alarm?(1-ph)*.9:0;r.scale.setScalar(.6+ph*1.4)});B.bz.position.x=6.2+(B.alarm?Math.sin(t*60)*.05:0);
 R.render(scene,cam);
 const w=innerWidth,h=innerHeight;labels.forEach(l=>{const v=l.p.clone().project(cam);const vis=v.z<1&&Math.abs(v.x)<1.1&&Math.abs(v.y)<1.1;l.d.style.display=vis?'':'none';if(vis)l.d.style.transform='translate('+((v.x+1)/2*w)+'px,'+((1-v.y)/2*h)+'px) translate(-50%,-100%)'});
 requestAnimationFrame(loop)}
size();build(SC);$('#load').remove();requestAnimationFrame(loop);
setTimeout(()=>{$('#tip').style.opacity=0},7000);
window.__ready=true;window.__look=(p,t)=>{cam.position.set(...p);ctl.target.set(...t);ctl.update()};
</script>
