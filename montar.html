<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Montar o projeto · Arduino e Robótica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400..700&family=Nunito:wght@400..800&display=swap">
<style>
:root{--navy:#0F1F4D;--blue:#2350E8;--cyan:#35D0F5;--yellow:#FFD23F;--paper:#F4F8FF;--ink:#0F1F4D;--ink2:#3A4E7E;--soft:#DCE8FF;
--display:'Fredoka','Trebuchet MS',Arial,sans-serif;--text:'Nunito','Segoe UI',Arial,sans-serif;
--c-in:#9966FF;--c-ctl:#FFAB19;--c-out:#4C97FF;--c-math:#59C059}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:var(--text)}
body{display:flex;flex-direction:column;min-height:100vh}
button{font-family:inherit}
header{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--navy);color:#fff;flex-wrap:wrap}
header h1{font:600 22px var(--display);margin:0 6px 0 0;white-space:nowrap}
header h1 span{color:var(--yellow)}
.projs{display:flex;gap:6px;flex-wrap:wrap}
.projs button{border:0;border-radius:20px;padding:7px 12px;font-weight:700;font-size:14px;background:rgba(255,255,255,.12);color:#fff;cursor:pointer}
.projs button.on{background:#fff;color:var(--navy)}
.spacer{flex:1}
.prog{font-size:13px;color:#B9CBF5;white-space:nowrap}
.prog b{color:#fff}
.acts{display:flex;gap:8px}
.acts button{border:0;border-radius:12px;padding:9px 14px;font-weight:800;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:6px}
#bHint{background:var(--yellow);color:var(--navy)}
#bAuto{background:#fff;color:var(--navy)}
#bReset{background:rgba(255,255,255,.14);color:#fff}
.acts button:active{transform:translateY(1px)}
main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;padding:14px;min-height:0}
.panel{background:#fff;border-radius:18px;box-shadow:0 2px 0 #D6E2FA,0 8px 24px rgba(15,31,77,.08);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.phead{display:flex;align-items:center;gap:10px;padding:12px 16px 8px}
.phead .n{width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font:700 16px var(--display)}
.phead h2{font:600 19px var(--display);margin:0}
.phead small{color:var(--ink2);font-size:13px}
.phead .ok{margin-left:auto;font-size:13px;font-weight:800;color:#1E9E5A;display:none}
.phead.done .ok{display:block}
#mission{margin:0 16px 6px;font-size:14px;color:var(--ink2)}
#mission b{color:var(--ink)}
#svgwrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 8px}
#board{width:100%;height:100%;max-height:100%;touch-action:none;user-select:none}
.ctrl{display:flex;align-items:center;gap:14px;padding:10px 16px 14px;border-top:1px solid #E6EDFB;flex-wrap:wrap}
#power{border:0;border-radius:14px;padding:10px 18px;font:700 16px var(--display);background:#1E9E5A;color:#fff;cursor:pointer;min-width:190px}
#power.on{background:#D8343F}
.sens{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700}
.sens input{width:170px;accent-color:var(--blue)}
.sens output{min-width:64px;font:600 17px var(--display);color:var(--blue)}
#mute{margin-left:auto;border:0;background:none;font-size:20px;cursor:pointer}
/* portas */
.port{cursor:crosshair}
.port .hit{fill:transparent}
.port .dot{fill:#2B2B2B;stroke:none}
.port.pin .dot{fill:#1A1A1A}
.port:hover .ring,.dragging-wire .port.free .ring{stroke:var(--yellow);stroke-width:3;fill:rgba(255,210,63,.25)}
.port .ring{fill:none;stroke:transparent}
.port.used .ring{stroke:transparent!important}
.port.hint .ring{stroke:#FF8A00;stroke-width:4;fill:rgba(255,138,0,.35);animation:pulse 1s infinite}
.port.target .ring{stroke:#1E9E5A;stroke-width:4;fill:rgba(30,158,90,.35)}
@keyframes pulse{50%{stroke-width:7}}
.wire{fill:none;stroke-linecap:round;cursor:pointer}
.wire.bad{stroke-dasharray:10 6}
.wire.hintbad{animation:blink .7s infinite}
@keyframes blink{50%{opacity:.25}}
.wcap{pointer-events:none}
.lbl{font:700 11px var(--text);fill:#fff}
.tip{font:700 13px var(--text)}
#ptip{position:fixed;pointer-events:none;background:var(--navy);color:#fff;font-size:13px;font-weight:700;padding:5px 9px;border-radius:8px;display:none;z-index:50;white-space:nowrap}
/* programação */
.seg{margin-left:auto;display:flex;background:#EEF3FD;border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:8px;font-weight:800;font-size:13px;color:var(--ink2);cursor:pointer}
.seg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.12)}
#codeArea{flex:1;min-height:0;display:grid;grid-template-columns:225px 1fr;border-top:1px solid #E6EDFB}
#codeArea.text{grid-template-columns:1fr}
#codeArea.text #tray,#codeArea.text #ws{display:none}
#codeArea:not(.text) #txt{display:none}
#tray{background:#F5F8FE;border-right:1px solid #E6EDFB;padding:12px 10px;overflow:auto;display:flex;flex-direction:column;gap:9px;align-items:flex-start}
#tray>.blk,#tray>.cblk{zoom:.86}
#tray .cblk{min-width:0}
#tray .th{font-size:12px;font-weight:800;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em}
#tray .empty{font-size:13px;color:#8796B8}
#ws{padding:14px;overflow:auto;position:relative;background-image:radial-gradient(#D9E3F7 1px,transparent 1px);background-size:18px 18px}
#txt{margin:0;padding:14px 16px;overflow:auto;font:14px/1.55 Consolas,'Courier New',monospace;background:#0F1F4D;color:#E6EDFF}
#txt .k{color:#FFAB19}#txt .c{color:#7FA0D8}#txt .n{color:#7BE0B0}#txt .f{color:#8FC2FF}#txt .q{color:#FF8FA3}
/* blocos */
.blk{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border-radius:9px;color:#fff;font-weight:800;font-size:14px;line-height:1.1;cursor:grab;box-shadow:0 3px 0 rgba(0,0,0,.22);user-select:none;touch-action:none;position:relative;white-space:nowrap}
.blk.in{background:var(--c-in)}.blk.out{background:var(--c-out)}.blk.math{background:var(--c-math);border-radius:22px;padding:6px 12px}
.blk input{width:60px;border:0;border-radius:12px;padding:3px 6px;font:800 14px var(--text);text-align:center;color:var(--ink)}
.blk .dotc{width:13px;height:13px;border-radius:50%;border:2px solid #fff;display:inline-block}
.cblk{display:inline-flex;flex-direction:column;background:var(--c-ctl);border-radius:10px;color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.22);cursor:grab;user-select:none;touch-action:none;min-width:250px}
.cblk .row{display:flex;align-items:center;gap:8px;padding:8px 12px;font-weight:800;font-size:14px;white-space:nowrap}
.cblk .body{margin-left:16px;background:#fff;border-radius:6px 0 0 6px;padding:5px 8px 5px 8px;min-height:40px;display:flex;flex-direction:column;align-items:flex-start;gap:0}
.cblk.forever{cursor:default}
.cblk.forever>.body{min-height:120px}
.cblk .foot{height:14px}
.slot{min-width:110px;height:30px;border-radius:16px;background:rgba(0,0,0,.18);border:2px dashed rgba(255,255,255,.55);display:inline-flex;align-items:center}
.slot.filled{background:none;border:0;min-width:0;height:auto}
.slot.hl{background:rgba(255,255,255,.55);border-color:#fff}
.gap{height:7px;width:100%;margin:1px 0;border-radius:4px}
.gap.hl{background:var(--yellow);height:10px;box-shadow:0 0 0 2px rgba(255,210,63,.4)}
.body .ph{font-size:12px;color:#9AA8C6;padding:6px 4px;font-weight:700}
.blk.ghost,.cblk.ghost{position:fixed;z-index:100;pointer-events:none;opacity:.92;transform:rotate(2deg);box-shadow:0 10px 24px rgba(0,0,0,.3)}
.drag-src{opacity:.28}
.pulse-b{animation:pb 1s infinite}
@keyframes pb{50%{box-shadow:0 0 0 6px rgba(255,138,0,.65),0 3px 0 rgba(0,0,0,.22)}}
.gap.hintgap{background:#FF8A00;height:10px;animation:blink .8s infinite}
.slot.hintgap{border-color:#FF8A00;background:rgba(255,138,0,.4);animation:blink .8s infinite}
/* dica */
#hintbar{position:fixed;left:50%;top:64px;transform:translateX(-50%) translateY(-30px);opacity:0;pointer-events:none;background:var(--navy);color:#fff;border-radius:16px;padding:12px 18px 12px 14px;display:flex;align-items:center;gap:12px;max-width:min(720px,92vw);box-shadow:0 12px 30px rgba(15,31,77,.35);transition:transform .25s,opacity .25s;z-index:60;font-size:15px;line-height:1.35}
#hintbar.on{transform:translateX(-50%);opacity:1;pointer-events:auto}
#hintbar .ic{font-size:26px}
#hintbar b{color:var(--yellow)}
#hintbar button{white-space:nowrap;border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:10px;padding:6px 10px;cursor:pointer;font-weight:800;margin-left:6px}
#win{position:fixed;inset:0;background:rgba(15,31,77,.55);display:none;align-items:center;justify-content:center;z-index:80}
#win.on{display:flex}
#win .card{background:#fff;border-radius:22px;padding:28px 30px;max-width:520px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.3)}
#win h3{font:600 30px var(--display);margin:0 0 8px}
#win p{font-size:17px;color:var(--ink2);margin:0 0 18px}
#win button{border:0;border-radius:14px;padding:12px 22px;font:700 17px var(--display);background:var(--blue);color:#fff;cursor:pointer}
@media (max-width:1100px){main{grid-template-columns:1fr}#codeArea{min-height:460px}}

#scenewrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 10px}
#scene{width:100%;height:100%;max-height:100%;user-select:none}
.lt{transition:fill .15s}
.lbl2{font:800 13px var(--text);fill:#33415C}
.tagw{font:800 12px var(--text);fill:#fff}
@keyframes flick{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.12)}}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick .35s infinite}
@keyframes rise{0%{transform:translateY(0);opacity:.0}30%{opacity:.8}100%{transform:translateY(-60px);opacity:0}}
.steam{animation:rise 2.4s infinite}
@keyframes drift{50%{transform:translate(8px,-6px)}}
.drift{animation:drift 3s ease-in-out infinite}
@keyframes ping{0%{opacity:.9;transform:scale(.6)}100%{opacity:0;transform:scale(1.25)}}
#tray .blk.pill,.blk.pill{border-radius:22px}
.blk.wt{background:#FFAB19}
.pulse-o{outline:3px dashed #FF8A00;outline-offset:3px}
.projs button.ex{background:rgba(255,210,63,.18)}
.projs button.ex.on{background:var(--yellow);color:var(--navy)}
.key{cursor:pointer}
.ping{transform-box:fill-box;transform-origin:50% 0;animation:ping 1s infinite}
</style>
</head>
<body>
<header>
  <h1>Programar o <span>projeto</span></h1>
  <div class="projs" id="projs"></div>
  <div class="spacer"></div>
  <div class="prog" id="prog"></div>
  <div class="acts">
    <button id="bHint" title="Mostra o próximo passo">🔦 Dica</button>
    <button id="bAuto" title="Encaixa o próximo bloco para você">✨ Encaixar o próximo</button>
    <button id="bReset" title="Começar de novo">↺ Recomeçar</button>
  </div>
</header>
<main>
  <section class="panel" id="pBench">
    <div class="phead" id="hBench"><span class="n">1</span><h2 id="sTitle">Na vida real</h2><small id="sSub"></small></div>
    <p id="mission"></p>
    <div id="scenewrap"><svg id="scene" viewBox="0 0 1000 600"></svg></div>
    <div class="ctrl"><button id="power">▶ Ligar o Arduino</button><div id="sensors" style="display:flex;gap:22px;flex-wrap:wrap"></div><button id="mute" title="Som do alarme">🔊</button></div>
  </section>
  <section class="panel" id="pCode">
    <div class="phead" id="hCode"><span class="n">2</span><h2>Programação</h2><small>arraste os blocos para dentro do “para sempre”</small><span class="ok">✔ programa completo</span><div class="seg"><button class="on" data-v="b">Blocos</button><button data-v="t">Texto</button></div></div>
    <div id="codeArea"><div id="tray"></div><div id="ws"></div><pre id="txt"></pre></div>
  </section>
</main>
<div id="hintbar"><span class="ic">🔦</span><span id="hintmsg"></span><button id="hintAuto">✨ Encaixar</button><button id="hintX">✕</button></div>
<div id="win"><div class="card"><h3>🎉 Programa pronto!</h3><p id="winmsg"></p><button id="winok">Bora testar</button></div></div>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const SVGNS='http://www.w3.org/2000/svg';
const el=(tag,attrs={},parent)=>{const e=document.createElementNS(SVGNS,tag);for(const k in attrs){if(attrs[k]!==null)e.setAttribute(k,attrs[k])}(parent||document.getElementById('scene')).appendChild(e);return e};
const LEDNM={r:'vermelho',y:'amarelo',g:'verde'};
const LEDPIN={r:2,y:3,g:4};
const LEDCOL={r:'#E53935',y:'#FDD835',g:'#43A047'};
const LON={r:'#FF3B30',y:'#FFE14D',g:'#3BEA6E'},LOFF={r:'#5A2A2A',y:'#5A5228',g:'#244A2E'};
const P={
 civil:{nome:'Civil',nomeL:'Construção Civil',proj:'Alarme de gás na cozinha',lugar:'Cozinha de uma casa',
  missao:'Programe o <b>alarme de gás</b>: sem gás, luz verde; com um pouco de gás, amarela; com muito gás (50 ppm ou mais), luz vermelha e a sirene toca.',
  win:'Liguem o Arduino e abram o gás do fogão aos pouquinhos. Vejam a luz mudar e a sirene tocar em 50 ppm!',
  vars:[{k:'gas',nm:'Vazamento de gás',min:0,max:100,v:0,u:' ppm'}],
  blocks:{
   read:{t:'read',txt:'ler o sensor de gás'},
   c1:{t:'cond',parts:['gás','≥',{n:50}]},
   c2:{t:'cond',parts:['gás','≥',{n:10}]},
   if3:{t:'if3'},lr:{t:'led',c:'r'},bp:{t:'beep'},ly:{t:'led',c:'y'},lg:{t:'led',c:'g'}},
  target:['read',{k:'if3',slots:{c1:'c1',c2:'c2'},bodies:{b1:['lr','bp'],b2:['ly'],b3:['lg']}}],
  ctext:{c1:v=>`gas >= ${v[0]}`,c2:v=>`gas >= ${v[0]}`},
  eval:{c1:(S,v)=>S.gas>=v[0],c2:(S,v)=>S.gas>=v[0]},
  readTxt:['int gas = 0;','gas = map(analogRead(A0), 0, 1023, 0, 100); // ppm']},
 agro:{nome:'Agro',nomeL:'Agroindústria',proj:'Pasteurização do leite',lugar:'Laticínio',
  missao:'Programe o <b>controle da pasteurização</b>: abaixo de 72 °C luz amarela (ainda não está pronto); de 72 a 80 °C luz verde; acima de 80 °C luz vermelha e a sirene toca.',
  win:'Liguem o Arduino e aumentem o fogo do tanque. Em 72 °C o leite fica pronto, e depois de 80 °C a sirene avisa que passou do ponto!',
  vars:[{k:'temp',nm:'Fogo do aquecedor → temperatura',min:20,max:100,v:30,u:' °C'}],
  blocks:{
   read:{t:'read',txt:'ler a temperatura do leite'},
   c1:{t:'cond',parts:['temperatura','>',{n:80}]},
   c2:{t:'cond',parts:['temperatura','≥',{n:72}]},
   if3:{t:'if3'},lr:{t:'led',c:'r'},bp:{t:'beep'},lg:{t:'led',c:'g'},ly:{t:'led',c:'y'}},
  target:['read',{k:'if3',slots:{c1:'c1',c2:'c2'},bodies:{b1:['lr','bp'],b2:['lg'],b3:['ly']}}],
  ctext:{c1:v=>`temperatura > ${v[0]}`,c2:v=>`temperatura >= ${v[0]}`},
  eval:{c1:(S,v)=>S.temp>v[0],c2:(S,v)=>S.temp>=v[0]},
  readTxt:['float temperatura = 0;','temperatura = (analogRead(A0) * 5.0 / 1024 - 0.5) * 100; // °C']},
 nutri:{nome:'Nutrição',proj:'Estoque de alimentos',lugar:'Despensa de um restaurante',
  missao:'Programe o <b>alarme do estoque</b>: tudo certo, luz verde; quase no limite, amarela; passou de 30 °C <b>ou</b> de 70% de umidade, luz vermelha e a sirene toca.',
  win:'Liguem o Arduino e deixem o estoque quente ou úmido. Basta um dos dois passar do limite para a sirene tocar!',
  vars:[{k:'temp',nm:'Temperatura',min:10,max:45,v:22,u:' °C'},{k:'umid',nm:'Umidade',min:20,max:95,v:50,u:'%'}],
  blocks:{
   read:{t:'read',txt:'ler temperatura e umidade'},
   c1:{t:'cond',parts:['temperatura','>',{n:30},'ou','umidade','>',{n:70}]},
   c2:{t:'cond',parts:['temperatura','≥',{n:27},'ou','umidade','≥',{n:60}]},
   if3:{t:'if3'},lr:{t:'led',c:'r'},bp:{t:'beep'},ly:{t:'led',c:'y'},lg:{t:'led',c:'g'}},
  target:['read',{k:'if3',slots:{c1:'c1',c2:'c2'},bodies:{b1:['lr','bp'],b2:['ly'],b3:['lg']}}],
  ctext:{c1:v=>`temperatura > ${v[0]} || umidade > ${v[1]}`,c2:v=>`temperatura >= ${v[0]} || umidade >= ${v[1]}`},
  eval:{c1:(S,v)=>S.temp>v[0]||S.umid>v[1],c2:(S,v)=>S.temp>=v[0]||S.umid>=v[1]},
  readTxt:['#include <DHT.h>\nDHT dht(7, DHT22);\nfloat temperatura = 0;\nfloat umidade = 0;','temperatura = dht.readTemperature();\n  umidade = dht.readHumidity();'],
  setupTxt:'  dht.begin();\n'},
 san:{nome:'Saneamento',proj:'Nível da caixa d’água',lugar:'Caixa d’água de um bairro',
  missao:'Programe o <b>alarme da caixa d’água</b>: até 60% luz verde; de 60% a 84% amarela; com 85% ou mais, luz vermelha e a sirene toca para desligarem a bomba.',
  win:'Liguem o Arduino e encham a caixa d’água. Com 85% a sirene tem que tocar antes de transbordar!',
  vars:[{k:'nivel',nm:'Bomba enchendo a caixa',min:0,max:100,v:30,u:'%'}],
  blocks:{
   read:{t:'read',txt:'ler o nível da caixa'},
   c1:{t:'cond',parts:['nível','≥',{n:85}]},
   c2:{t:'cond',parts:['nível','≥',{n:60}]},
   if3:{t:'if3'},lr:{t:'led',c:'r'},bp:{t:'beep'},ly:{t:'led',c:'y'},lg:{t:'led',c:'g'}},
  target:['read',{k:'if3',slots:{c1:'c1',c2:'c2'},bodies:{b1:['lr','bp'],b2:['ly'],b3:['lg']}}],
  ctext:{c1:v=>`nivel >= ${v[0]}`,c2:v=>`nivel >= ${v[0]}`},
  eval:{c1:(S,v)=>S.nivel>=v[0],c2:(S,v)=>S.nivel>=v[0]},
  readTxt:['int nivel = 0;\n\n// mede a distância até a água e transforma em % da caixa\nint lerNivel(int trig, int echo) {\n  digitalWrite(trig, HIGH);\n  delayMicroseconds(10);\n  digitalWrite(trig, LOW);\n  long cm = pulseIn(echo, HIGH) / 58;\n  return constrain(map(cm, 60, 5, 0, 100), 0, 100);\n}','nivel = lerNivel(10, 9); // % da caixa'],
  setupTxt:'  pinMode(10, OUTPUT); // TRIG\n  pinMode(9, INPUT);   // ECHO\n'}
};

const ALERT_HEAD=(R)=>`${R[0]}\n\nvoid acenderSo(int pino) {\n  digitalWrite(2, pino == 2);\n  digitalWrite(3, pino == 3);\n  digitalWrite(4, pino == 4);\n}`;
['civil','agro','nutri','san'].forEach(k=>{const p=P[k];p.tray=['lg','if3','c2','read','bp','c1','ly','lr'];p.head=ALERT_HEAD(p.readTxt);
  p.setup='  pinMode(2, OUTPUT); // LED vermelho\n  pinMode(3, OUTPUT); // LED amarelo\n  pinMode(4, OUTPUT); // LED verde\n  pinMode(8, OUTPUT); // buzzer\n'+(p.setupTxt||'');p.loopPost='  delay(100);\n'});
P.braco={nome:'🤖 Braço',extra:true,proj:'Braço robótico',lugar:'Projeto extra',
  missao:'Programe o <b>braço robótico</b>: cada potenciômetro controla um motor, e o <b>botão da garra</b> abre e fecha a garra. Depois usem o braço para pegar os bloquinhos e empilhar!',
  win:'Liguem o Arduino, girem os potenciômetros <b>Base</b> e <b>Braço</b> até a garra chegar num bloquinho e apertem o <b>botão da garra</b> (ou a barra de espaço) para pegar. Apertem de novo para soltar!',
  done:'O programa está pronto! Ligue o Arduino e gire os potenciômetros. Desafio: mude o <b>180</b> para <b>90</b>, ou aumente o tempo do <b>aguardar</b>.',

   case 'if3':return `${sp}if (${valC(b.slots.c1)}) {\n${body('b1')}${sp}} else if (${valC(b.slots.c2)}) {\n${body('b2')}${sp}} else {\n${body('b3')}${sp}}\n`;
   case 'if1':return `${sp}if (${valC(b.slots.c)}) {\n${body('b')}${sp}}\n`;
   case 'servo':return `${sp}${d.v}.write(${valC(b.slots.v)}); // motor ${d.nm}\n`;
   case 'wait':return `${sp}delay(${Math.round(b.nums[0]*1000)}); // espera ${String(b.nums[0]).replace('.',',')} s\n`;
   case 'note':return `${sp}nota = ${b.nums[0]}; // ${d.nota}\n`;
   case 'grip':return `${sp}garraAberta = !garraAberta; // abre ou fecha\n${sp}garra.write(garraAberta ? 90 : 0);\n${sp}delay(300);\n`;
   default:return `${sp}// (bloco solto: ${valC(k)})\n`;
  }}
function genCode(){
  return `// ${PR.proj} (${PR.nomeL||PR.nome.replace(/^\S+ /,'')})\n${PR.head}\n\nvoid setup() {\n${PR.setup}}\n\nvoid loop() {\n${PR.loopPre||''}${ST.forever.map(k=>stmtC(k,1)).join('')||'  // o programa ainda está vazio\n'}${PR.loopPost||''}}\n`;
}
function hl(code){return esc(code).replace(/(\/\/[^\n]*|\/\*.*?\*\/)/g,'<span class="c">$1</span>').replace(/\b(void|int|float|long|bool|return|if|else|include)\b/g,'<span class="k">$1</span>').replace(/\b(\d+(\.\d+)?)\b/g,'<span class="n">$1</span>').replace(/\b(digitalWrite|digitalRead|pinMode|tone|noTone|analogRead|map|delay|acenderSo|lerNivel|setup|loop|pulseIn|delayMicroseconds|constrain|readTemperature|readHumidity|begin|write|attach)\b/g,'<span class="f">$1</span>')}
function renderText(){$('#txt').innerHTML=hl(genCode())}
/* ---------- verificação, dica e "encaixar o próximo" ---------- */
function match(s,t){if(s===t)return true;const a=bdef(s),b=bdef(t);return !!(a.eq&&a.eq===b.eq)}
function issue(){
  const cmp=(tl,sl,o,name)=>{
    for(let i=0;i<tl.length;i++){const node=tl[i],t=nkey(node),s=sl[i];
      if(s===undefined)return {kind:'add',k:t,o,name,i};
      if(!match(s,t))return {kind:'wrong',k:s};
      for(const e of (LAYOUT[bdef(t).t]||[])){const [w,n]=e.split(':');
        if(w==='s'){const ts=node.slots[n],ss=ST.blocks[s].slots[n];if(!ss)return {kind:'slot',k:ts,o:s,name:n};if(!match(ss,ts))return {kind:'wrong',k:ss}}
        else{const r=cmp(node.bodies[n],ST.blocks[s].bodies[n],s,n);if(r)return r}}
    }
    if(sl.length>tl.length)return {kind:'wrong',k:sl[tl.length]};
    return null};
  return cmp(PR.target,ST.forever,'root','forever');
}
function counts(){
  let total=0,ok=0;
  const walk=(tl,sl,good)=>{tl.forEach((node,i)=>{const t=nkey(node);const s=sl?sl[i]:undefined;total++;const g=good&&s!==undefined&&match(s,t);if(g)ok++;
    for(const e of (LAYOUT[bdef(t).t]||[])){const [w,n]=e.split(':');
      if(w==='s'){total++;if(g&&ST.blocks[s].slots[n]&&match(ST.blocks[s].slots[n],node.slots[n]))ok++}
      else walk(node.bodies[n],g?ST.blocks[s].bodies[n]:null,g)}})};
  walk(PR.target,ST.forever,true);return {ok,total};
}
function avail(t){if(ST.tray.includes(t))return t;const d=bdef(t);if(d.eq){const c=ST.tray.find(x=>bdef(x).eq===d.eq);if(c)return c}return t}
const LISTNM={b1:'no primeiro <b>então</b> do “se”',b2:'no segundo <b>então</b> (o do “senão, se”)',b3:'no <b>senão</b> do final'};
function listName(o,n){if(o==='root')return 'dentro do <b>para sempre</b>';const d=bdef(o);if(d.t==='if3')return LISTNM[n];return `dentro do <b>então</b> do “se” que pisca`}
function slotName(o,n){const d=bdef(o);if(d.t==='if3')return `no ${n==='c1'?'primeiro':'segundo'} espaço vazio do “se”`;if(d.t==='servo')return `no espaço vazio do “girar motor ${d.nm}”`;return 'no espaço vazio do “se” que pisca'}
function bname(k){const d=bdef(k);switch(d.t){case 'if3':return '“se … senão, se … senão”';case 'if1':return '“se … então”';case 'read':return `“${d.txt}”`;case 'led':return `“acender só o LED ${LEDNM[d.c]}”`;case 'beep':return '“tocar o apito”';
  case 'cond':return `“${d.parts.map(p=>p&&p.n!==undefined?'…':p).join(' ')}”`;case 'servo':return `“girar motor ${d.nm}”`;case 'map':return `“potenciômetro ${d.nm}”`;case 'wait':return '“aguardar”';case 'btn':return d.txt?`“${d.txt.replace(/<[^>]+>/g,'')}”`:`“tecla ${d.nota} apertada”`;case 'grip':return '“abrir / fechar a garra”';case 'note':return `“tocar a nota ${d.nota}”`}}
const hintbar=$('#hintbar');let hintOn=null;
function clearHint(){hintbar.classList.remove('on');hintOn=null;$$('.pulse-b').forEach(x=>x.classList.remove('pulse-b'));$$('.hintgap').forEach(x=>x.classList.remove('hintgap'));$$('.pulse-o').forEach(x=>x.classList.remove('pulse-o'))}
function doneMsg(){return PR.done||'O programa está pronto! Clique em <b>▶ Ligar o Arduino</b> e mexa na barrinha embaixo da cena.'}
function showHint(){
  clearHint();if(ST.txt)setView(false);const I=issue();
  if(!I){hintMsg(doneMsg());return}
  hintOn=I;const pulse=k=>{const e=$(`#tray [data-b="${k}"]`)||$(`#ws [data-b="${k}"]`);if(e)e.classList.add('pulse-b')};
  if(I.kind==='wrong'){hintMsg(`O bloco ${bname(I.k)} não vai aí. Arraste ele de volta para a coluna de blocos.`);pulse(I.k)}
  else if(I.kind==='slot'){const k=avail(I.k);hintMsg(`Arraste o bloco ${bname(k)} ${slotName(I.o,I.name)}.`);pulse(k);const s=$(`#ws .slot[data-o="${I.o}"][data-slot="${I.name}"]`);if(s)s.classList.add('hintgap');const ob=$(`#ws [data-b="${I.o}"]`);if(ob&&I.o!=='root'&&bdef(I.o).t==='if1')ob.classList.add('pulse-o')}
  else{const k=avail(I.k);hintMsg(`Arraste o bloco ${bname(k)} para ${listName(I.o,I.name)}.`);pulse(k);const g=$(`#ws .gap[data-o="${I.o}"][data-list="${I.name}"][data-i="${I.i}"]`);if(g)g.classList.add('hintgap');const ob=$(`#ws [data-b="${I.o}"]`);if(ob&&I.o!=='root'&&bdef(I.o).t==='if1')ob.classList.add('pulse-o')}
}
function hintMsg(h){$('#hintmsg').innerHTML=h;hintbar.classList.add('on');$('#hintAuto').style.display=issue()?'':'none'}
function autoStep(){
  const I=issue();clearHint();if(ST.txt)setView(false);if(!I){hintMsg(doneMsg());return}
  if(I.kind==='wrong')toTray(I.k);else if(I.kind==='slot')putSlot(avail(I.k),I.o,I.name);else insertAt(avail(I.k),I.o,I.name,I.i);
  changed();
}
/* ---------- simulação ---------- */
let tick=0,actx=null,osc=null,gain=null,lastRun=0,pressed={};
const SIM={led:null,beep:false,note:0,servo:{},wait:0,claw:true};let lastGrip=0;
function evalV(k,S){if(!k)return null;const d=bdef(k),b=ST.blocks[k];
  if(d.t==='cond'){PR.vars.forEach(v=>{if(S[v.k]===undefined)S[v.k]=0});return PR.eval[k](S,b.nums)}
  if(d.t==='btn')return !!pressed[d.nota];
  if(d.t==='map')return b.nums[0]+(b.nums[1]-b.nums[0])*(ST.vals[d.pot]/1023);
  return null}
function runProgram(){
  const S={};const out={led:null,beep:false,note:0,servo:{},wait:0};
  const exec=k=>{const d=bdef(k),b=ST.blocks[k];
    switch(d.t){
     case 'read':PR.vars.forEach(v=>S[v.k]=ST.vals[v.k]);break;
     case 'led':out.led=d.c;break;case 'beep':out.beep=true;break;
     case 'if3':if(evalV(b.slots.c1,S))b.bodies.b1.forEach(exec);else if(evalV(b.slots.c2,S))b.bodies.b2.forEach(exec);else b.bodies.b3.forEach(exec);break;
     case 'if1':if(evalV(b.slots.c,S))b.bodies.b.forEach(exec);break;
     case 'servo':{const v=evalV(b.slots.v,S);if(v!==null)out.servo[d.j]=Math.max(0,Math.min(180,v));break}
     case 'wait':out.wait+=Math.max(0,b.nums[0]);break;
     case 'note':out.note=b.nums[0];break;
     case 'grip':if(Date.now()-lastGrip>300){SIM.claw=!SIM.claw;lastGrip=Date.now()}break;}};
  ST.forever.forEach(exec);return out;
}
function tone(freq){if(muted)freq=0;if(!gain)return;if(freq>0){osc.frequency.setTargetAtTime(freq,actx.currentTime,.005);gain.gain.setTargetAtTime(PR.soft?.08:.05,actx.currentTime,.01)}else gain.gain.setTargetAtTime(0,actx.currentTime,.01)}
function initAudio(){try{if(!actx){actx=new (window.AudioContext||window.webkitAudioContext)();osc=actx.createOscillator();gain=actx.createGain();osc.type=PR.soft?'triangle':'square';osc.frequency.value=950;gain.gain.value=0;osc.connect(gain).connect(actx.destination);osc.start()}osc.type=PR.soft?'triangle':'square';if(actx.state==='suspended')actx.resume()}catch(e){actx=null;gain=null}}
setInterval(()=>{if(!PR)return;tick++;const now=Date.now();
  if(running){if(now-lastRun>=SIM.wait*1000){const o=runProgram();Object.assign(SIM,{led:o.led,beep:o.beep,note:o.note,wait:o.wait});Object.assign(SIM.servo,o.servo);lastRun=now}}
  else Object.assign(SIM,{led:null,beep:false,note:0,wait:0});
  updateScene(Object.assign({},SIM,{claw:SIM.claw}));
  if(PR.piano)tone(running?SIM.note:0);else tone(running&&SIM.beep&&(tick%4<2)?950:0);
},60);
/* ---------- interface geral ---------- */
function renderSensors(){
  const box=$('#sensors');box.innerHTML='';
  if(PR.ctrlTip){box.innerHTML=`<span class="sens">${PR.ctrlTip}</span>`;return}
  if(PR.ctrlTip2){const t=document.createElement('span');t.className='sens';t.innerHTML=PR.ctrlTip2;box.appendChild(t)}
  PR.vars.forEach(v=>{const d=document.createElement('label');d.className='sens';
    d.innerHTML=`${v.nm} <input type="range" min="${v.min}" max="${v.max}" value="${ST.vals[v.k]}"><output>${ST.vals[v.k]}${v.u}</output>`;
    const r=d.querySelector('input');r.addEventListener('input',()=>{ST.vals[v.k]=+r.value;d.querySelector('output').textContent=r.value+v.u;save()});box.appendChild(d)});
}
function updateProg(){const c=counts();$('#prog').innerHTML=`Blocos encaixados <b>${c.ok}/${c.total}</b>`;$('#hCode').classList.toggle('done',!issue())}
let wasDone=false;
function changed(soft){if(!soft)renderBlocks();else renderText();updateProg();save();
  const done=!issue();if(done&&!wasDone){$('#winmsg').innerHTML=PR.win;$('#win').classList.add('on')}wasDone=done;
  if(hintOn)setTimeout(()=>{if(hintbar.classList.contains('on'))showHint()},0);
}
function setView(t){ST.txt=t;$('#codeArea').classList.toggle('text',t);$$('.seg button').forEach(b=>b.classList.toggle('on',(b.dataset.v==='t')===t));renderText()}
function setPower(on){running=on;const b=$('#power');b.classList.toggle('on',on);b.textContent=on?'■ Desligar':'▶ Ligar o Arduino';if(on){initAudio();lastRun=0;SIM.wait=0}else tone(0)}
function choose(k){
  cur=k;PR=P[k];ST=load(k)||fresh();setPower(false);pressed={};SIM.servo={};SIM.claw=true;
  $$('#projs button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));
  $('#sTitle').textContent=PR.proj;$('#sSub').textContent=PR.lugar;
  $('#mission').innerHTML=PR.missao;
  drawScene();renderSensors();clearHint();setView(!!ST.txt);
  wasDone=!issue();changed();
  try{localStorage.setItem('prog2-cur',k)}catch(e){}
  if(location.hash!=='#'+k)history.replaceState(null,'','#'+k);
}
$('#projs').innerHTML=ORDER.map(k=>`<button data-k="${k}"${P[k].extra?' class="ex"':''}>${P[k].nome}</button>`).join('');
$$('#projs button').forEach(b=>b.addEventListener('click',()=>choose(b.dataset.k)));
$('#bHint').addEventListener('click',showHint);
$('#bAuto').addEventListener('click',autoStep);
$('#hintAuto').addEventListener('click',autoStep);
$('#hintX').addEventListener('click',clearHint);
let resetArm=0;
$('#bReset').addEventListener('click',()=>{const b=$('#bReset');if(Date.now()-resetArm>3000){resetArm=Date.now();b.textContent='Clique de novo';setTimeout(()=>b.textContent='↺ Recomeçar',3000);return}
  b.textContent='↺ Recomeçar';ST=fresh();setPower(false);SIM.servo={};SIM.claw=true;if(cur==='braco')drawScene();renderSensors();clearHint();setView(false);wasDone=!issue();changed()});
$('#power').addEventListener('click',()=>setPower(!running));
$('#mute').addEventListener('click',()=>{muted=!muted;$('#mute').textContent=muted?'🔇':'🔊'});
$$('.seg button').forEach(b=>b.addEventListener('click',()=>{setView(b.dataset.v==='t');save()}));
$('#winok').addEventListener('click',()=>{$('#win').classList.remove('on');setPower(true)});
window.addEventListener('hashchange',()=>{const k=location.hash.slice(1);if(P[k]&&k!==cur)choose(k)});
/* teclado do piano */
const KEYMAP={a:0,s:1,d:2,f:3,g:4,h:5};
document.addEventListener('keydown',e=>{if(PR&&cur==='braco'&&e.code==='Space'&&!e.target.closest('input')){pressed.garra=true;e.preventDefault();return}if(!PR||!PR.piano||e.target.closest('input'))return;const i=KEYMAP[e.key.toLowerCase()];if(i!==undefined){pressed[PR.notas[i]]=true;e.preventDefault()}});
document.addEventListener('keyup',e=>{if(PR&&cur==='braco'&&e.code==='Space'){pressed.garra=false;return}if(!PR||!PR.piano)return;const i=KEYMAP[e.key.toLowerCase()];if(i!==undefined)pressed[PR.notas[i]]=false});
window.__press=(n,v)=>{pressed[n]=v};
const h=location.hash.slice(1);let first='civil';try{first=localStorage.getItem('prog2-cur')||'civil'}catch(e){}
choose(P[h]?h:(P[first]?first:'civil'));
window.__prog={issue,autoStep,get ST(){return ST},choose,runProgram,SIM};


})();
</script>
